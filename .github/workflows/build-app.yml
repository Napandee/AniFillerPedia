name: Build and deploy backend

# Path-filtered on purpose (CLAUDE.md Guardrails — monorepo split, decided
# 2026-08-21): this must never fire on a frontend/-only change once
# frontend/ exists. Built in from the start rather than retrofitted later.
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/build-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/anifillerpedia-backend:latest

  deploy:
    needs: build
    runs-on: [self-hosted, afp-droplet]
    permissions:
      contents: read
      packages: read

    steps:
      # #96: this used to be a sparse `actions/checkout@v4` of
      # docker-compose.yml + Caddyfile — but that checks files out into the
      # runner's own ephemeral workdir (/tmp/afp-runner/...), not into
      # ${{ vars.APPDATA_PATH }} below, which is what `docker compose`
      # actually reads. That made it dead code: it fetched real files into
      # a location nothing ever read, while APPDATA_PATH's checkout only
      # ever advanced via someone manually SSHing in and running `git
      # pull`. This step runs directly against APPDATA_PATH instead, right
      # before the compose commands below (same job — no race). --ff-only,
      # not `reset --hard`: if the checkout was ever hand-edited outside
      # git (against this project's own rule, CLAUDE.local.md), this
      # should fail loudly, not silently discard the edit.
      - name: Fast-forward the droplet's checkout to this commit
        working-directory: ${{ vars.APPDATA_PATH }}
        run: |
          git fetch origin master
          git merge --ff-only origin/master

      # Fixed 2026-08-21 (real failure, caught by actually running this
      # workflow end to end): originally read a hand-managed GHCR_TOKEN
      # from a local .env file, which needed the file to exist at exactly
      # ${{ vars.APPDATA_PATH }} (never set — that's bug #1 this same pass
      # found) and a manually-provisioned pull token (bug #2). Using the
      # same auto-provided, auto-scoped GITHUB_TOKEN the `build` job
      # already uses above eliminates both — no local file, no manual
      # token to create or rotate.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-service stack (app/postgres/worker/runner/caddy) — pull +
      # `compose up` rather than AniDex's raw `docker run` for a single
      # container. `--no-deps` on app/worker keeps this from restarting
      # postgres/caddy/the runner itself on every backend deploy.
      - name: Pull new image and restart app + worker
        working-directory: ${{ vars.APPDATA_PATH }}
        run: |
          docker compose pull app worker
          docker compose up -d --no-deps app worker
