name: Validate frontend build

# Path-filtered — monorepo split (CLAUDE.md Guardrails, 2026-08-21). Mirrors
# pr-validate.yml's shape for the backend; frontend has no test suite yet
# (#31), so this checks build + types only.
on:
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validate.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
