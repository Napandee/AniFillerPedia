name: Validate backend PR build

# No `paths:` filter here on purpose. Branch protection on `master` requires
# the `build` check this job produces, with no path-based exception on its own
# side — so a workflow-level path filter meant a docs-only PR could never
# produce that check at all and sat permanently BLOCKED, needing an admin
# bypass to merge (hit by #244). This workflow now always triggers and always
# produces a `build` check; the "Detect diff scope" step below decides
# internally whether to run the expensive parts, so branch protection stays
# satisfiable through the normal flow instead of through --admin.
#
# The monorepo split (CLAUDE.md Guardrails, 2026-08-21) still holds — it is
# now enforced inside the job rather than at the trigger. Same fix AniDex
# applied in its issue #506 after three admin bypasses.
# See frontend-validate.yml for the frontend/ equivalent.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: afp_test
          POSTGRES_USER: afp_test
          POSTGRES_PASSWORD: afp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afp_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # Replaces the old trigger-level path filter. Same intent — don't run a
      # backend build for a diff it cannot say anything about — but decided
      # here, inside the job, so the job (and its `build` check) always runs
      # and always reports. A PR mixing code with docs still gets the full
      # run: skip_build only becomes true when EVERY changed file is one none
      # of the steps below could catch a regression in.
      - name: Detect diff scope
        id: scope
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          skip_build=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              backend/*|docker-compose.yml|Caddyfile|.github/workflows/pr-validate.yml)
                skip_build=false ;;
              *) ;;
            esac
          done <<< "$changed"
          echo "skip_build=$skip_build" >> "$GITHUB_OUTPUT"
          if [ "$skip_build" = "true" ]; then
            echo "::notice::No backend-relevant file changed ($(echo "$changed" | tr '\n' ' ')) — skipping the build, schema, pytest and smoke steps. They cannot exercise anything this diff could break. The build check still reports so branch protection is satisfied."
          fi

      - name: Set up Python
        if: steps.scope.outputs.skip_build != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        if: steps.scope.outputs.skip_build != 'true'
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Build image (no push)
        if: steps.scope.outputs.skip_build != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: anifillerpedia-backend:pr-test

      - name: Apply schema to test database
        if: steps.scope.outputs.skip_build != 'true'
        run: |
          PGPASSWORD=afp_test psql -h localhost -U afp_test -d afp_test -f backend/schema.sql

      # #188 follow-up: a handful of tests (tests/test_anilist_lookup.py,
      # tests/test_admin.py, tests/test_auth.py) assume at least one
      # `series` row already exists — true for every maintainer's local
      # test-pg (always seeded from data/bootstrap/ per CLAUDE.local.md),
      # never true for a genuinely fresh schema-only Postgres, which is
      # exactly what this job's service container is. Confirmed via a real
      # CI run before this step existed: 4 failures, all NoResultFound /
      # a correct-but-unexpected "found" instead of "already_exists" for
      # Naruto: Shippuuden's real AniList id — not application bugs, a
      # test-fixture gap this step closes with the one row those tests'
      # own docstrings already document depending on (anilist_id 1735,
      # "confirmed already catalogued in this project's own test-pg
      # snapshot"). Not a change to test logic/assertions, deliberately
      # out of #188's scope — this seeds the precondition instead.
      - name: Seed minimal fixture data for tests
        if: steps.scope.outputs.skip_build != 'true'
        run: |
          PGPASSWORD=afp_test psql -h localhost -U afp_test -d afp_test -c \
            "INSERT INTO series (anilist_id, title, provenance) VALUES (1735, 'Naruto: Shippuuden', 'manami_bootstrap');"

      # #188: run the real pytest suite (backend/tests/, ~4,700 lines of
      # real-Postgres integration tests, not mocks) against the same
      # Postgres service + schema the smoke test below reuses — folded into
      # this job (not a separate one) so it's covered by the existing
      # required "build" status check without a branch-protection change.
      - name: Run backend test suite (pytest)
        if: steps.scope.outputs.skip_build != 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://afp_test:afp_test@localhost:5432/afp_test
        run: pytest

      # ASSUMPTION TO VERIFY once #6 lands for real: this expects a health
      # endpoint at /health returning 200. If #6 ships it at a different path
      # (e.g. /api/v1/health per the versioned API convention in CLAUDE.md),
      # update this step's URL — don't assume this guess is correct.
      - name: Smoke-test the built image
        if: steps.scope.outputs.skip_build != 'true'
        run: |
          docker run -d --name afp-smoke --network host \
            -e DATABASE_URL="postgresql+asyncpg://afp_test:afp_test@localhost:5432/afp_test" \
            anifillerpedia-backend:pr-test

          ok=""
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8000/api/v1/health; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "App never became reachable on :8000/api/v1/health"
            docker logs afp-smoke
            exit 1
          fi
          echo "Smoke test passed: health endpoint responded."

      - name: Container logs
        if: always() && steps.scope.outputs.skip_build != 'true'
        run: docker logs afp-smoke || true

      - name: Clean up
        if: always() && steps.scope.outputs.skip_build != 'true'
        run: docker rm -f afp-smoke || true
