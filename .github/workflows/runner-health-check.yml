name: Self-hosted runner health check

# #192: nothing previously alerted if the self-hosted deploy runner
# (afp-droplet) goes unregistered or unhealthy. A `deploy` job queued
# against an offline runner never fails on its own — it just sits queued
# forever — so `if: failure()`-style alerting structurally can't catch it.
# This is a separate, scheduled poll instead, same shape/cadence as the
# existing uptime-check.yml (#17): every 15 minutes, `workflow_dispatch`
# added so it can be run manually (including for the test below).
#
# Compounds with #190 (dead alerting): TELEGRAM_BOT_TOKEN isn't
# provisioned yet, so the alert step is structurally wired correctly but
# can't actually deliver a notification until #190 is resolved by someone
# with that credential — see this issue's own PR description for the
# verification that was possible without it.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      runner_name:
        description: >-
          Runner name to check (defaults to the real afp-droplet runner).
          Override with a name that doesn't exist, e.g.
          "does-not-exist-test", to verify the unhealthy-detection path
          end-to-end without touching the real deploy runner.
        required: false
        default: afp-droplet

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check afp-droplet runner status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_NAME_INPUT: ${{ github.event.inputs.runner_name }}
        run: |
          RUNNER_NAME="${RUNNER_NAME_INPUT:-afp-droplet}"
          echo "RUNNER_NAME=$RUNNER_NAME" >> "$GITHUB_ENV"

          runner_json=$(gh api "repos/${{ github.repository }}/actions/runners" \
            | jq -c --arg name "$RUNNER_NAME" '.runners[] | select(.name == $name)')

          if [ -z "$runner_json" ]; then
            echo "Runner '$RUNNER_NAME' is not registered at all."
            echo "status=missing" >> "$GITHUB_ENV"
            exit 0
          fi

          status=$(echo "$runner_json" | jq -r '.status')
          echo "Runner '$RUNNER_NAME' status: $status"
          echo "status=$status" >> "$GITHUB_ENV"

      - name: Alert if the runner isn't online
        if: env.status != 'online'
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="8528154154" \
            --data-urlencode text="AniFillerPedia: self-hosted runner '$RUNNER_NAME' is NOT online (status: $status). Deploys queued against it will sit forever until this is fixed. Run: $RUN_URL"
