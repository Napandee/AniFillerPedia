# Production stack for the DO Droplet. Seven services: the FastAPI app, its
# Postgres, the outbox-events worker, the Astro frontend, the read-only MCP
# server (#178), a self-hosted GitHub Actions runner (so
# build-app.yml/frontend-deploy.yml/mcp-deploy.yml can deploy without a
# webhook/SSH hop), and Caddy for automatic TLS.
#
# Unlike AniDex's pattern (raw `docker pull` + `docker run`, no Compose),
# this project genuinely needs multi-container orchestration on one box —
# app, Postgres, worker, frontend, mcp, and runner all coordinate here.
# Compose IS the deploy mechanism for this project, not just a
# container-manager convenience file. See CLAUDE.md Architecture /
# Decisions Made for why.
#
# Backend image is built from ./backend (monorepo split — CLAUDE.md
# Guardrails). The frontend's build context is the repo root, not
# ./frontend — the one deliberate exception, since #41's docs/contribute
# pages bake in docs/API.md and CONTRIBUTING.md at build time (see
# frontend/Dockerfile's own comment for why). `mcp`'s build context is
# ./mcp, same as backend — it's a standalone Python service that only ever
# calls the public REST API over HTTP (never touches Postgres directly),
# so it needs nothing from outside its own directory (see mcp/README.md).

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/napandee/anifillerpedia-backend:latest
    container_name: afp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000" # Caddy proxies to this; not exposed directly

  postgres:
    image: postgres:16-alpine
    container_name: afp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: anifillerpedia
      POSTGRES_USER: anifillerpedia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anifillerpedia"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    # Same image as `app` — the outbox poller is a different entrypoint into
    # the same backend/ codebase, not a separate build. #9's real entrypoint
    # is backend/worker.py (flat layout, matching main.py's own
    # `from routers import health` style — no `app` package wrapper).
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/napandee/anifillerpedia-backend:latest
    container_name: afp-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Internal Docker network hostname, not the public domain — the
        # frontend's SSR fetches go straight to `app` rather than round-
        # tripping out through Caddy and back in. Baked in at build time
        # (Vite inlines import.meta.env.PUBLIC_* — see frontend/src/
        # middleware.ts), so this can't be a plain `environment:` entry.
        PUBLIC_API_BASE_URL: http://app:8000
    image: ghcr.io/napandee/anifillerpedia-frontend:latest
    container_name: afp-frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:4321:4321" # Caddy proxies to this; not exposed directly

  mcp:
    # #178, Phase 1 of #159's spike decision: read-only MCP tools wrapping
    # the public REST API. Deliberately its own build/deploy unit (not
    # folded into `app`) — same monorepo hard-separation guardrail as
    # backend/frontend, now extended to a third leg (mcp/README.md).
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: ghcr.io/napandee/anifillerpedia-mcp:latest
    container_name: afp-mcp
    restart: unless-stopped
    environment:
      # Internal Docker network hostname — same pattern as the frontend's
      # own PUBLIC_API_BASE_URL build arg above, except this is a plain
      # runtime env var (no build-time inlining needed; afp_client.py reads
      # it at call time via os.environ, see mcp/afp_client.py).
      AFP_API_BASE_URL: http://app:8000
    depends_on:
      - app
    ports:
      - "127.0.0.1:8001:8000" # Caddy proxies to this; not exposed directly

  runner:
    image: myoung34/github-runner:latest
    container_name: afp-runner
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/Napandee/AniFillerPedia
      RUNNER_NAME: afp-droplet
      RUNNER_SCOPE: repo
      LABELS: self-hosted,afp-droplet
      ACCESS_TOKEN: ${GITHUB_RUNNER_ACCESS_TOKEN}
      RUNNER_WORKDIR: /tmp/afp-runner
      # No EPHEMERAL variable here — deliberately, not an oversight
      # (2026-09-03). This image's entrypoint.sh checks whether the
      # variable is SET AT ALL (`[ -n "${EPHEMERAL}" ]`), not its value,
      # so the previous `EPHEMERAL: "false"` was silently enabling
      # ephemeral (fresh-container-per-job) mode the whole time despite
      # clearly intending persistent mode. Confirmed by reading the
      # entrypoint directly inside the running container. Omitting the
      # variable entirely is the only way to actually get persistent
      # mode with this image.
      #
      # Prevents the exact corruption this project hit repeatedly on
      # 2026-09-03: the runner's own self-update (triggered whenever
      # GitHub's minimum supported version moves past the pulled image's
      # bundled one) races against the container's own teardown after a
      # job completes, leaving Runner.Listener partially
      # written/corrupted. The runner just uses whatever version
      # myoung34/github-runner:latest ships instead of trying to
      # self-update in place. DISABLE_AUTO_UPDATE is the variable name
      # this image's own entrypoint.sh actually checks (confirmed by
      # reading it directly) — an earlier attempt used
      # DISABLE_RUNNER_UPDATE, which this image doesn't recognize at all,
      # so that fix silently never took effect.
      DISABLE_AUTO_UPDATE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/tmp/afp-runner
      # Docker-outside-of-Docker (the socket mount above) means `docker`
      # commands run *inside* this container control the *host's* daemon —
      # but `docker compose` itself still needs docker-compose.yml visible
      # in whatever filesystem is running the command. Bind-mount the repo
      # at the identical host path so build-app.yml's deploy job
      # (working-directory: ${{ vars.APPDATA_PATH }}) resolves correctly on
      # both sides. Fixed 2026-08-21 — real failure caught by actually
      # running the deploy job end to end ("No such file or directory").
      - /opt/AniFillerPedia:/opt/AniFillerPedia

  caddy:
    image: caddy:2-alpine
    container_name: afp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - frontend
      - mcp

volumes:
  runner-work:
  caddy-data:
  caddy-config:
