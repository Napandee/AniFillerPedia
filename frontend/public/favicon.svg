<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- AniFillerPedia favicon: a two-tone circle, split into the site's own
       canon (green) and filler (orange) status colors — the same two
       colors every StatusBadge uses, so the mark encodes the actual
       product rather than being an arbitrary lettermark. -->
  <circle cx="16" cy="16" r="15" fill="#22c55e"/>
  <path d="M16,16 L16,1 A15,15 0 0 1 16,31 Z" fill="#ff9f43"/>
  <line x1="16" y1="1" x2="16" y2="31" stroke="#fff8f2" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="15" fill="none" stroke="#fff8f2" stroke-width="2"/>
</svg>
